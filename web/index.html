<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trascrizioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // tema chiaro di base; lo scuro solo se scelto col bottone
  try { if (localStorage.getItem("tema") === "scuro") document.documentElement.dataset.theme = "dark"; } catch (e) {}
</script>
</head>
<body>
<header class="header">
  <div class="header-riga">
    <a class="brand" href="#/" aria-label="Trascrizioni — tutti i progetti">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></span>
      <span class="brand-testo"><span class="brand-name">trascrizioni</span><span class="brand-data" id="brand-data"></span></span>
    </a>
    <form class="ricerca-globale" id="form-ricerca" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="ricerca-globale" placeholder="Cerca in trascrizioni, appunti e riassunti" aria-label="Cerca in trascrizioni, appunti e riassunti (scorciatoia \)">
      <kbd class="kbd-ricerca" title="Premi \ per cercare">premi <b>\</b></kbd>
    </form>
    <div class="header-destra">
      <div id="processi-attivi" class="azioni" aria-live="polite"></div>
      <button class="btn icona fantasma" id="tema" aria-label="Passa al tema scuro" title="Passa al tema scuro">
        <svg class="icona-sole" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icona-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
  </div>
  <nav class="topnav" aria-label="Navigazione principale (Ctrl+← / Ctrl+→ o Alt+1…4 per passare da una sezione all'altra)" title="Ctrl+← / Ctrl+→ oppure Alt+1…4">
    <a href="#/" data-nav="progetti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Progetti</a>
    <a href="#/chat" data-nav="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</a>
    <a href="#/calendario" data-nav="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    <a href="#/impostazioni" data-nav="impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Impostazioni</a>
  </nav>
</header>
<main class="contenuto" id="vista" tabindex="-1"></main>

<dialog id="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>

<div id="toasts" aria-live="polite"></div>
<script>
  // stessa intestazione della home: nome e data di oggi
  document.getElementById("brand-data").textContent =
    new Date().toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
</script>
<script src="effetti.js"></script>
<script src="app.js"></script>
</body>
</html>
